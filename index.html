<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Het Thuisfront</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thuisfront">
<meta name="theme-color" content="#F4F6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14151F" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: één-koloms telefoon-app, vaste tabbalk onderin, zonnige aftelkaart als hart van de Dag-weergave */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#F8F9FD; --line:#E2E6F0;
  --fg:#1E2235; --muted:#686E86; --accent:#EE4E5A; --accent-ink:#FFFFFF; --accent-soft:#FFE4E3;
  --hero-a:#FF5F6D; --hero-b:#FFAE45; --hero-fg:#FFFFFF; --hero-muted:rgba(255,255,255,.86); --sun:#FFD84D;
  --teal:#13A89E; --teal-soft:#D8F4F1; --teal-ink:#FFFFFF;
  --danger:#C7343F; --danger-soft:#FDE2E2; --warn:#B86E00;
  --shadow:0 1px 2px rgba(30,34,53,.05),0 6px 20px rgba(30,34,53,.07);
  --fab-glow:rgba(238,78,90,.35);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14151F; --surface:#1D1F2C; --surface-2:#252837; --line:#333649;
  --fg:#F1F2F8; --muted:#A3A7BD; --accent:#FF7079; --accent-ink:#22090C; --accent-soft:#3B2229;
  --hero-a:#E8505E; --hero-b:#EE9535; --hero-fg:#FFFFFF; --hero-muted:rgba(255,255,255,.86); --sun:#FFE07A;
  --teal:#3FD0C4; --teal-soft:#173A38; --teal-ink:#0E2422;
  --danger:#FF8A8F; --danger-soft:#3D1F24; --warn:#F2B64B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --fab-glow:rgba(255,112,121,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14151F; --surface:#1D1F2C; --surface-2:#252837; --line:#333649;
  --fg:#F1F2F8; --muted:#A3A7BD; --accent:#FF7079; --accent-ink:#22090C; --accent-soft:#3B2229;
  --hero-a:#E8505E; --hero-b:#EE9535; --hero-fg:#FFFFFF; --hero-muted:rgba(255,255,255,.86); --sun:#FFE07A;
  --teal:#3FD0C4; --teal-soft:#173A38; --teal-ink:#0E2422;
  --danger:#FF8A8F; --danger-soft:#3D1F24; --warn:#F2B64B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --fab-glow:rgba(255,112,121,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}

/* inloggen */
.login{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);overflow-y:auto}
.login-card{width:100%;max-width:380px;display:grid;gap:10px;text-align:center}
.login-card img{width:84px;height:84px;border-radius:20px;margin:0 auto;box-shadow:var(--shadow)}
.login-card h2{margin:6px 0 0;font-family:var(--f-display);font-weight:800;font-size:26px}
.login-card p{margin:0 0 6px;color:var(--muted)}
.login-card .form{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}

/* iPhone geeft datum- en tijdvelden een eigen minimale breedte; zo passen ze naast elkaar */
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.fld input[type="date"],.fld input[type="time"]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;text-align:left}
.fld input::-webkit-date-and-time-value{text-align:left}

/* projecten */
.projecten{display:grid;gap:10px}
.project{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--pk);border-radius:14px;padding:12px 14px;display:grid;gap:8px;cursor:pointer;text-align:left}
.project:active{transform:scale(.99)}
.project-h{display:flex;align-items:baseline;gap:8px}
.project-h b{flex:1;min-width:0;font-family:var(--f-display);font-size:18px;font-weight:700;overflow-wrap:anywhere}
.aftel{font-size:12.5px;font-weight:700;color:var(--pk);white-space:nowrap}
.pbar{height:7px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pk);border-radius:99px}
.project-m{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.project-v{font-size:13px;color:var(--muted)}
.project-v b{color:var(--fg);font-weight:600}
.proj-chip{display:inline-flex;align-items:center;gap:5px}
.proj-info{display:grid;gap:4px;margin:-2px 0 4px;font-size:13.5px;color:var(--muted)}
.proj-info p{margin:0;color:var(--fg);white-space:pre-wrap}
.badge-af{justify-self:start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--teal-soft);color:var(--teal);border-radius:6px;padding:2px 7px}
.notitie-knoppen{display:flex;gap:8px;margin-top:12px}
.notities{display:grid;gap:10px;margin-top:12px}
.notitie{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.notitie-h{display:flex;align-items:baseline;gap:8px;padding:11px 14px 4px;cursor:pointer}
.notitie-h b{flex:1;min-width:0;font-size:15.5px;overflow-wrap:anywhere}
.notitie-h .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.soort{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2px 6px;flex:0 0 auto}
.notitie-t{margin:2px 14px 0;color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.notitie-a{padding:10px 14px 12px}
.notitie-a .btn{display:inline-flex;align-items:center;gap:6px}
.notitie-a .btn svg{width:13px;height:13px}
.notitie.is-omgezet{opacity:.7}
.omgezet{display:inline-block;font-size:11.5px;font-weight:700;color:var(--teal);background:var(--teal-soft);border-radius:6px;padding:2px 7px;white-space:nowrap}
.li{padding:4px 0 2px}
.li-row{display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--line)}
.li-row .check{width:24px;height:24px;margin:0}
.li-row.done .check{background:var(--teal);border-color:var(--teal)}
.li-row.done .check svg{opacity:1;color:var(--teal-ink)}
.li-t{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14.5px}
.li-row.done .li-t{text-decoration:line-through;color:var(--muted)}
.mini{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;color:var(--accent);flex:0 0 auto}
.mini.x{color:var(--muted);font-size:16px;line-height:1;padding:3px 8px}
.li-add{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface-2)}
.li-add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;font-size:16px}
.tabs button{min-width:0}
@media (max-width:380px){.tabs button{font-size:10px}}

/* agenda */
.agenda-btn{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--accent);padding:11px 12px}
.agenda-btn svg{width:18px;height:18px}
.agenda-info{display:grid;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.agenda-info span{color:var(--muted);font-size:13.5px}
.hint{margin:0;color:var(--muted);font-size:13.5px}

/* instellingen */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:13px 14px;text-align:left;cursor:pointer;font-size:14.5px}
.list > .set-row:first-child{border-top:0}
.set-row span{min-width:0;overflow-wrap:anywhere}
.set-row b{color:var(--accent);font-weight:600;text-align:right;flex:0 1 auto;overflow-wrap:anywhere}
.set-row b.out{color:var(--danger)}
.versie{margin:10px 2px 0;font-size:12px;color:var(--muted)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}

/* kop */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:10px;display:flex;align-items:center;gap:12px}
.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));display:grid;place-items:center;flex:0 0 auto}
.mark svg{width:22px;height:22px}
.brand{min-width:0;flex:1}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.1}
.brand a{color:var(--muted);font-size:12.5px;text-decoration:none}
.brand a:hover{text-decoration:underline}
.me{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px 5px 6px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;flex:0 0 auto}

/* aftellen */
.hero{background:radial-gradient(circle at 94% 6%,rgba(255,255,255,.22) 0 64px,transparent 65px),radial-gradient(circle at 4% 120%,rgba(255,255,255,.14) 0 80px,transparent 81px),linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-fg);border-radius:20px;padding:18px 18px 16px;display:grid;gap:12px;box-shadow:var(--shadow)}
.hero .eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--hero-muted);font-weight:600}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.clock div{display:grid;gap:2px}
.clock b{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,10vw,44px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock div:first-child b{color:var(--hero-fg);text-shadow:0 2px 0 rgba(0,0,0,.08)}
.clock span{font-size:11.5px;color:var(--hero-muted)}
.hero .where{font-size:13.5px;color:var(--hero-muted)}
.hero .where strong{color:var(--hero-fg);font-weight:600}
.prog{display:grid;gap:6px}
.prog .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}
.prog .bar i{display:block;height:100%;background:#FFFFFF;border-radius:99px;transition:width .4s}
.prog .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--hero-muted);font-variant-numeric:tabular-nums}

/* filters */
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;display:inline-block}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-block:12px 4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 4px;font-weight:600;font-size:13px;color:var(--muted);min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* navigatie dag/week */
.nav{display:flex;align-items:center;gap:8px;margin-block:14px 6px}
.nav h2{flex:1;margin:0;font-family:var(--f-display);font-weight:700;font-size:19px;text-wrap:balance}
/* tik op de datum of het weeknummer: er ligt een onzichtbaar datumveld overheen dat de kalender van de telefoon opent */
.kies-datum{position:relative;flex:1;min-width:0;border-radius:10px}
.kies-datum h2{display:block}
.kies-datum .kies-pijl{width:16px;height:16px;margin-left:6px;vertical-align:-1px;color:var(--accent)}
.kies-datum input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0;border:0;-webkit-appearance:none;appearance:none;cursor:pointer;font-size:16px}
.kies-datum:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.toon-klaar{display:block;margin:10px auto 0}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:0 0 auto}
.icon-btn svg{width:18px;height:18px}
.link-btn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13.5px;padding:6px 4px}

/* secties en rijen */
.sec{margin-top:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 6px}
.sec-h h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sec-h .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-h.late h3{color:var(--danger)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:0 0 auto;display:grid;place-items:center;margin-top:1px;padding:0}
.check svg{width:14px;height:14px;opacity:0}
.row.done .check{background:var(--teal);border-color:var(--teal)}
.row.done .check svg{opacity:1;color:var(--teal-ink)}
.body{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0}
.ttl{font-weight:600;overflow-wrap:anywhere}
.row.done .ttl{text-decoration:line-through;color:var(--muted);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:12.5px;color:var(--muted)}
.meta .who{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--fg)}
.meta .over{color:var(--danger);font-weight:600}
.flag{color:var(--warn);font-weight:700}
.winkel-h{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.winkel-h h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px}
.winkel-h .n{font-size:12.5px;color:var(--muted);flex:1}
.winkel .link-btn{margin-top:4px}
.qa{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface-2)}
.list .qa:first-child{border-top:0}
.qa input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;font-size:16px}
.row.bood{padding-block:9px}
.qty{display:inline-block;min-width:22px;margin-right:6px;padding:0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.row.done .qty{background:transparent;color:var(--muted)}
.rep{display:inline-flex;align-items:center;gap:4px;color:var(--teal);font-weight:600}
.rep svg{width:13px;height:13px}
.row.proj .check{border-style:dashed;cursor:default}
.row.proj .ttl{color:var(--muted);font-weight:500}
.price{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;flex:0 0 auto;padding-top:2px}
.row.done .price{color:var(--muted);font-weight:500}
.empty{padding:18px 14px;color:var(--muted);font-size:14px;text-align:center}
.empty b{display:block;color:var(--fg);margin-bottom:2px}
.note{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:13.5px;margin-top:12px}
.note.err{border-style:solid;border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.add-inline{width:100%;border:0;border-top:1px solid var(--line);background:transparent;color:var(--accent);font-weight:600;font-size:13.5px;padding:10px 12px;text-align:left}
.list .add-inline:first-child{border-top:0}

/* week */
.day{margin-top:12px}
.day-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.day-h button{border:0;background:transparent;padding:0;font-family:var(--f-display);font-weight:700;font-size:16px}
.day-h .today{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:2px 6px}
.day-h .move{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--sun);color:#2A1E04;border-radius:6px;padding:2px 6px}
.day-h .n{margin-left:auto;font-size:12px;color:var(--muted)}

/* totaalregel kopen */
.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tot span{font-size:12px;color:var(--muted);display:block}
.tot b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}

/* personen */
.people{display:grid;gap:10px;margin-top:12px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.person-h{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px;flex:0 0 auto}
.person-h .nm{flex:1;min-width:0}
.person-h .nm b{display:block;font-size:16px}
.person-h .nm span{font-size:12.5px;color:var(--muted)}
.stats{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}
.person .next{font-size:13px;color:var(--muted)}
.person .next b{color:var(--fg);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}

/* tabbalk */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tabs button{border:0;background:transparent;padding:8px 2px 9px;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:31;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow),0 8px 24px var(--fab-glow);display:grid;place-items:center}
.fab svg{width:26px;height:26px}

/* invoervel */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,16,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin:0 0 12px;font-family:var(--f-display);font-weight:700;font-size:20px}
.form{display:grid;gap:12px}
.fld{display:grid;gap:5px;min-width:0}
.fld > label,.fld > .lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 11px;font-size:16px;min-width:0}
.fld textarea{min-height:68px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:4px;flex-wrap:wrap}
.actions .right{display:flex;gap:8px;margin-left:auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(144px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px}
.toast button{border:0;background:transparent;color:inherit;font-weight:800;text-decoration:underline;padding:4px 0;white-space:nowrap;flex:0 0 auto}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// De sleutels van het Firebase-project. Die mogen openbaar zijn: wie erbij mag, staat in de Firestore-regels.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBCNNEfKCdQzKs4zkZUCH9nxPwFlo2B22g",
  authDomain: "thuisfront.firebaseapp.com",
  projectId: "thuisfront",
  storageBucket: "thuisfront.firebasestorage.app",
  messagingSenderId: "459061218486",
  appId: "1:459061218486:web:f861fb9c7c97b530f82a17",
};
const VERSIE = "9 okt 2026 · 6";

(function(){
"use strict";

/* ---------- instellingen (staan in de opslag, niet in deze openbare code) ---------- */
let VERHUISDAG = null;
let ADRES = "";
function zetInstellingen(d){
  ADRES = (d && d.adres) || "";
  VERHUISDAG = d && /^\d{4}-\d{2}-\d{2}$/.test(d.verhuisdag || "") ? parse(d.verhuisdag) : null;
  S.instellingen = d || {};
}
const SOORTEN = [["taak","Taak"],["kopen","Kopen"],["regelen","Regelen"]];
const STANDAARD_CATS = ["Verhuizing","Bruiloft","Huishouden","Klussen","Administratie","Overig"];
const VASTE_CATS = ["Verhuizing","Bruiloft"]; // altijd bovenaan in Taken, ook als ze nog leeg zijn
const KLEUREN = ["#C2547A","#E07A2F","#2F7FC2","#7A5BC2","#2E8A57","#B8892A","#5A6B74"];
const HERHAAL = [["","Niet"],["1d","Elke dag"],["1w","Elke week"],["2w","Om de week"],["1m","Elke maand"]];

/* ---------- hulpjes ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay()+6)%7; return addDays(x, -wd); };
const vandaag = () => iso(new Date());
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtLang = s => parse(s).toLocaleDateString("nl-NL",{weekday:"long", day:"numeric", month:"long"});
const fmtKort = s => parse(s).toLocaleDateString("nl-NL",{weekday:"short", day:"numeric", month:"short"});
const euro = new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR"});
const lsGet = k => { try { return localStorage.getItem("thuisfront."+k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem("thuisfront."+k, v); } catch(e){} };
const weekNr = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); };

/* ---------- herhalen ---------- */
const EENHEID = {d:"dag", w:"week", m:"maand"};
const herhaalKey = h => h && h.n ? h.n + ({dag:"d", week:"w", maand:"m"}[h.eenheid] || "") : "";
const herhaalVanKey = k => k ? {n: +k.slice(0,-1), eenheid: EENHEID[k.slice(-1)]} : null;
const herhaalLabel = h => { const k = herhaalKey(h); const f = HERHAAL.find(x => x[0] === k); return f ? f[1] : (h ? `Elke ${h.n} ${h.eenheid === "maand" ? "maanden" : h.eenheid === "week" ? "weken" : "dagen"}` : ""); };
function stap(d, h){
  if (h.eenheid === "dag") return addDays(d, h.n);
  if (h.eenheid === "week") return addDays(d, 7 * h.n);
  const x = new Date(d.getFullYear(), d.getMonth() + h.n, 1);
  const laatste = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate();
  x.setDate(Math.min(d.getDate(), laatste));
  return x;
}
// valt dit item op dag d? Voor herhalende items: de eerstvolgende keer (datum) en alles daarna
function valtOp(t, d){
  if (!t.herhaal || !t.datum) return t.datum === d;
  if (d < t.datum) return false;
  if (d === t.datum) return true;
  const h = t.herhaal, diff = Math.round((parse(d) - parse(t.datum)) / 864e5);
  if (h.eenheid === "dag") return diff % h.n === 0;
  if (h.eenheid === "week") return diff % (7 * h.n) === 0;
  let x = parse(t.datum);
  for (let i = 0; i < 120; i++){ x = stap(x, h); const s = iso(x); if (s === d) return true; if (s > d) return false; }
  return false;
}
function volgendeKeer(t){
  const today = vandaag();
  let x = stap(parse(t.datum || today), t.herhaal);
  while (iso(x) <= today) x = stap(x, t.herhaal);
  return iso(x);
}

/* ---------- agenda (.ics) ---------- */
const APP_URL = "https://robinklunder.github.io/thuisfront/";
const ALARMEN = [["avond","Avond ervoor, 20:00"],["ochtend","Op de dag, 7:30"],["uur","1 uur van tevoren"],["geen","Geen herinnering"]];
const icsTekst = s => String(s || "").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
// regels in een agendabestand mogen niet te lang zijn; langere regels gaan verder op een regel die met een spatie begint
function icsVouw(r){ const uit = []; while (r.length > 70){ uit.push(r.slice(0,70)); r = " " + r.slice(70); } uit.push(r); return uit.join("\r\n"); }
// minuten -> duur zoals PT7H30M of -PT4H
function icsDuur(min){ const neg = min < 0; min = Math.abs(min); const h = Math.floor(min/60), m = min % 60; return (neg ? "-" : "") + "PT" + (h ? h + "H" : "") + (m || !h ? m + "M" : ""); }
function maakIcs(t, alarm){
  const d = t.datum.replace(/-/g,"");
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const r = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Het Thuisfront//NL","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT","UID:" + t.id + "@thuisfront","DTSTAMP:" + stamp];
  let start = 0; // minuten na middernacht; 0 bij een taak zonder tijd
  if (t.tijd){
    const [h, m] = t.tijd.split(":").map(Number);
    start = h * 60 + m;
    const eind = Math.min(start + 30, 23 * 60 + 59);
    r.push("DTSTART:" + d + "T" + pad(h) + pad(m) + "00", "DTEND:" + d + "T" + pad(Math.floor(eind/60)) + pad(eind % 60) + "00");
  } else {
    r.push("DTSTART;VALUE=DATE:" + d, "DTEND;VALUE=DATE:" + iso(addDays(parse(t.datum), 1)).replace(/-/g,""));
  }
  if (t.herhaal) r.push("RRULE:FREQ=" + {dag:"DAILY", week:"WEEKLY", maand:"MONTHLY"}[t.herhaal.eenheid] + ";INTERVAL=" + t.herhaal.n);
  const p = personById(t.wie);
  const wie = t.wisselen ? "" : t.wie === "samen" ? "samen" : p ? p.naam : "";
  const titel = t.titel + (wie ? " (" + wie + ")" : "");
  r.push(icsVouw("SUMMARY:" + icsTekst(titel)));
  const uitleg = ["Toegevoegd vanuit Het Thuisfront", t.notitie, t.wisselen ? "Gaat om en om. Kijk in de app wie er aan de beurt is." : ""].filter(Boolean).join("\n");
  r.push(icsVouw("DESCRIPTION:" + icsTekst(uitleg)));
  r.push("URL:" + APP_URL, "CATEGORIES:Thuisfront");
  if (alarm && alarm !== "geen"){
    const trig = alarm === "avond" ? icsDuur(-(start + 4 * 60))      // 20:00 de avond ervoor
               : alarm === "ochtend" ? icsDuur(7 * 60 + 30 - start)  // 7:30 op de dag zelf
               : icsDuur(-60);
    r.push("BEGIN:VALARM","ACTION:DISPLAY",icsVouw("DESCRIPTION:" + icsTekst(titel)),"TRIGGER:" + trig,"END:VALARM");
  }
  r.push("END:VEVENT","END:VCALENDAR");
  return r.join("\r\n") + "\r\n";
}
function bewaarIcs(t, alarm){
  const naam = (t.titel || "taak").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "taak";
  const url = URL.createObjectURL(new Blob([maakIcs(t, alarm)], {type: "text/calendar;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url; a.download = naam + ".ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const ICON_KIES = '<svg class="kies-pijl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
const ICON_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M12 13v4M10 15h4"/></svg>';
const ICON_REP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.7 5.6L4 15.5M4 20v-4.5h4.5"/></svg>';
const ICON_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>';
const ICON_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>';

/* ---------- toestand ---------- */
const S = {
  db: null, ready: false, canWrite: true, loadErr: "",
  people: [], tasks: [],
  view: lsGet("view") || "dag",
  dag: vandaag(),
  toonKlaar: false, toastActie: null,
  projecten: [], notities: [], project: null, projTab: "taken",
  week: iso(monday(new Date())),
  filter: lsGet("filter") || "alle",
  takenStatus: "open",
  kopenTab: lsGet("kopenTab") || "boodschappen",
  winkels: [], drafts: {}, wisArmed: "",
  ik: lsGet("ik") || "",
  sheet: null,
  busy: new Set(),
};

const personById = id => S.people.find(p => p.id === id);
const projectById = id => S.projecten.find(p => p.id === id);
const matchFilter = t => S.filter === "alle" || t.wie === S.filter || t.wie === "samen";
const sortTasks = (a,b) =>
  (a.klaar - b.klaar) ||
  ((b.belangrijk?1:0) - (a.belangrijk?1:0)) ||
  ((a.datum||"9999") < (b.datum||"9999") ? -1 : (a.datum||"9999") > (b.datum||"9999") ? 1 : 0) ||
  ((a.tijd||"99") < (b.tijd||"99") ? -1 : (a.tijd||"99") > (b.tijd||"99") ? 1 : 0) ||
  String(a.titel).localeCompare(String(b.titel), "nl");
const sortByTime = (a,b) => (a.klaar - b.klaar) || ((a.tijd||"99") < (b.tijd||"99") ? -1 : (a.tijd||"99") > (b.tijd||"99") ? 1 : 0) || ((b.belangrijk?1:0)-(a.belangrijk?1:0));

/* ---------- bouwstenen ---------- */
function whoHtml(wie){
  if (wie === "samen") return `<span class="who"><span class="dot" style="background:linear-gradient(90deg,${S.people.slice(0,2).map(p=>esc(p.kleur)).join(",")||"var(--muted),var(--muted)"})"></span>Samen</span>`;
  const p = personById(wie);
  if (!p) return `<span>Nog niemand</span>`;
  return `<span class="who"><span class="dot" style="background:${esc(p.kleur)}"></span>${esc(p.naam)}</span>`;
}
function rowHtml(t, opt = {}){
  const today = vandaag();
  const meta = [];
  meta.push(whoHtml(t.wie));
  if (t.datum && !opt.hideDate){
    const late = !t.klaar && t.datum < today;
    meta.push(`<span class="${late ? "over" : ""}">${late ? "Te laat · " : t.herhaal ? "Volgende: " : ""}${esc(fmtKort(t.datum))}</span>`);
  }
  if (t.tijd) meta.push(`<span>${esc(t.tijd)}</span>`);
  if (t.herhaal) meta.push(`<span class="rep">${ICON_REP}${esc(herhaalLabel(t.herhaal))}${t.wisselen ? " · om en om" : ""}</span>`);
  if (t._gedaan) meta.push(`<span>Gedaan</span>`);
  if (opt.showLaatst && t.laatstKlaar) meta.push(`<span>Laatst: ${esc(fmtKort(t.laatstKlaar))}</span>`);
  if (t.soort !== "taak" && !opt.hideSoort) meta.push(`<span>${t.soort === "kopen" ? "Kopen" : "Regelen"}</span>`);
  const proj = t.project ? projectById(t.project) : null;
  if (proj && !opt.hideProj) meta.push(`<span class="proj-chip"><span class="dot" style="background:${esc(proj.kleur)}"></span>${esc(proj.naam)}</span>`);
  // een categorie met dezelfde naam als het project is dubbelop
  if (t.categorie && !opt.hideCat && !(proj && proj.naam === t.categorie)) meta.push(`<span>${esc(t.categorie)}</span>`);
  if (t.belangrijk && !t.klaar) meta.push(`<span class="flag">Belangrijk</span>`);
  const price = (t.soort === "kopen" && typeof t.prijs === "number") ? `<span class="price">${euro.format(t.prijs)}</span>` : "";
  const lbl = t._gedaan ? "Afvinken ongedaan maken" : t.klaar ? "Markeer als open" : "Markeer als klaar";
  return `<div class="row${t.klaar ? " done" : ""}${t._proj ? " proj" : ""}">
    <button class="check" type="button" data-act="toggle" data-id="${esc(t.id)}" ${t._gedaan ? 'data-mode="undo"' : ""} aria-label="${lbl}: ${esc(t.titel)}" ${S.canWrite && !t._proj ? "" : "disabled"}>${ICON_CHECK}</button>
    <button class="body" type="button" data-act="edit" data-id="${esc(t.id)}">
      <div class="ttl">${esc(t.titel)}</div>
      <div class="meta">${meta.join("")}</div>
      ${t.notitie && !opt.compact ? `<div class="meta">${esc(t.notitie)}</div>` : ""}
    </button>${price}
  </div>`;
}
function listHtml(items, emptyTitle, emptyText, opt = {}, addPreset){
  const add = (addPreset && S.canWrite) ? `<button class="add-inline" type="button" data-act="new" data-preset='${esc(JSON.stringify(addPreset))}'>+ Toevoegen</button>` : "";
  if (!items.length) return `<div class="list">${emptyTitle ? `<div class="empty"><b>${esc(emptyTitle)}</b>${esc(emptyText||"")}</div>` : ""}${add}</div>`;
  return `<div class="list">${items.map(t => rowHtml(t,opt)).join("")}${add}</div>`;
}
function secHtml(title, items, inner, cls = ""){
  return `<section class="sec"><div class="sec-h ${cls}"><h3>${esc(title)}</h3><span class="n">${items}</span></div>${inner}</section>`;
}
function filterChips(){
  const opts = [["alle","Iedereen",""]].concat(S.people.map(p => [p.id, p.naam, p.kleur]));
  return `<div class="chips" role="group" aria-label="Filter op persoon">${opts.map(([id,naam,kl]) =>

function statusNote(){
  if (S.loadErr) return `<div class="note err">${esc(S.loadErr)}</div>`;

/* ---------- aftellen ---------- */
// alles wat op dag d hoort: gewone items, de eerstvolgende of latere keer van herhalende items,
// en herhalende items die op die dag zijn afgevinkt (die tonen als gedaan)
function itemsOpDag(all, d){
  const today = vandaag(), out = [];
  for (const t of all){
    if (!t.herhaal){ if (t.datum === d) out.push(t); continue; }
    if (t.laatstKlaar === d){ out.push(Object.assign({}, t, {klaar:true, _gedaan:true, wie: t.laatstDoor || t.wie})); continue; }
    if (t.datum === d) out.push(t);
    else if (d >= today && valtOp(t, d)) out.push(Object.assign({}, t, {_proj:true}));
  }
  return out;
}

function heroHtml(){
  if (!VERHUISDAG) return "";
  const verh = S.tasks.filter(t => (t.project === "verhuizing" || (t.categorie||"") === "Verhuizing") && !t.herhaal);
  const klaar = verh.filter(t => t.klaar).length;
  const pct = verh.length ? Math.round(klaar / verh.length * 100) : 0;
  return `<section class="hero" aria-label="Aftellen tot de verhuizing">
    <div class="eyebrow" id="cdHead">Nog tot de verhuizing</div>
    <div class="clock" id="clock" aria-live="off">
      <div><b id="cdD">--</b><span>dagen</span></div>
      <div><b id="cdU">--</b><span>uur</span></div>
      <div><b id="cdM">--</b><span>min</span></div>
      <div><b id="cdS">--</b><span>sec</span></div>
    </div>
    <div class="where">${esc(cap(VERHUISDAG.toLocaleDateString("nl-NL",{weekday:"long", day:"numeric", month:"long"})))}${ADRES ? ` · <strong>${esc(ADRES)}</strong>` : ""}</div>
    <div class="prog">
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="lbl"><span>Verhuistaken klaar</span><span>${klaar} van ${verh.length}</span></div>
    </div>
  </section>`;
}
function tick(){
  const d = $("#cdD"); if (!d || !VERHUISDAG) return;
  let ms = VERHUISDAG - new Date();
  if (ms <= 0){
    const dagNa = (new Date() - VERHUISDAG) < 864e5;
    $("#cdHead").textContent = dagNa ? "Vandaag is de grote verhuisdag" : "Welkom in jullie nieuwe huis";
    ["#cdD","#cdU","#cdM","#cdS"].forEach(s => $(s).textContent = "0");
    return;
  }
  const s = Math.floor(ms/1000);
  d.textContent = Math.floor(s/86400);
  $("#cdU").textContent = pad(Math.floor(s%86400/3600));
  $("#cdM").textContent = pad(Math.floor(s%3600/60));
  $("#cdS").textContent = pad(s%60);
}
setInterval(tick, 1000);

function viewWeek(){
  const start = parse(S.week);
  const end = addDays(start, 6);
  const today = vandaag();
  const verh = VERHUISDAG ? iso(VERHUISDAG) : "";
  const all = S.tasks.filter(matchFilter);

  let h = statusNote() + filterChips();
  h += `<div class="nav">
    <button class="icon-btn" type="button" data-act="week" data-n="-1" aria-label="Vorige week">${ICON_L}</button>

      <h2>Week ${weekNr(start)} <span style="font-weight:500;color:var(--muted);font-size:15px;text-transform:none">${esc(fmtR(start))} – ${esc(fmtR(end))}</span>${ICON_KIES}</h2>

function viewTaken(){

/* ---------- projecten ---------- */
const dagenTot = datum => Math.round((parse(datum) - parse(vandaag())) / 864e5);
function aftelTekst(datum){
  const n = dagenTot(datum);
  return n > 1 ? `nog ${n} dagen` : n === 1 ? "morgen" : n === 0 ? "vandaag" : fmtKort(datum);
}
function projectStats(p){
  const taken = S.tasks.filter(t => t.project === p.id && t.soort !== "boodschap");
  const eenmalig = taken.filter(t => !t.herhaal);
  const open = taken.filter(t => !t.klaar);
  const volgende = open.filter(t => t.datum).sort((a,b) => (a.datum + (a.tijd||"99")).localeCompare(b.datum + (b.tijd||"99")))[0];
  const notities = S.notities.filter(n => n.project === p.id);
  return {
    taken, open, volgende, notities,
    totaal: eenmalig.length, klaar: eenmalig.filter(t => t.klaar).length,
    ideeen: notities.filter(n => n.soort === "idee").length, lijsten: notities.filter(n => n.soort === "lijst").length,
  };
}
function viewProjecten(){
  const open = S.project && projectById(S.project);
  if (open) return viewProject(open);
  S.project = null;
  const lopend = S.projecten.filter(p => p.status !== "afgerond");
  const af = S.projecten.filter(p => p.status === "afgerond");
  let h = statusNote();
  h += `<div class="sec-h" style="margin-top:14px"><h3>Lopende projecten</h3>${S.canWrite ? `<button class="btn sm" type="button" data-act="new-project">+ Project</button>` : ""}</div>`;
  h += lopend.length
    ? `<div class="projecten">${lopend.map(projectKaart).join("")}</div>`

  if (af.length) h += secHtml("Afgerond", af.length, `<div class="list">${af.map(p =>
    `<button class="set-row" type="button" data-act="open-project" data-id="${esc(p.id)}"><span><span class="dot" style="background:${esc(p.kleur)}"></span> ${esc(p.naam)}</span><b>Bekijk</b></button>`).join("")}</div>`);
  return h;
}
function projectKaart(p){
  const s = projectStats(p);
  const pct = s.totaal ? Math.round(s.klaar / s.totaal * 100) : 0;
  const delen = [];
  if (s.ideeen) delen.push(`${s.ideeen} ${s.ideeen === 1 ? "idee" : "ideeën"}`);
  if (s.lijsten) delen.push(`${s.lijsten} ${s.lijsten === 1 ? "lijst" : "lijsten"}`);
  return `<div class="project" role="button" tabindex="0" data-act="open-project" data-id="${esc(p.id)}" style="--pk:${esc(p.kleur || "#EE4E5A")}">

    <div class="project-m"><span>${s.klaar} van ${s.totaal} ${s.totaal === 1 ? "taak" : "taken"} klaar</span>${delen.length ? `<span>${delen.join(" · ")}</span>` : ""}</div>
    ${s.volgende ? `<div class="project-v">Eerstvolgend: <b>${esc(s.volgende.titel)}</b> · ${esc(fmtKort(s.volgende.datum))}</div>` : ""}

function viewProject(p){
  const s = projectStats(p);
  let h = statusNote();
  h += `<div class="nav">
    <button class="icon-btn" type="button" data-act="sluit-project" aria-label="Terug naar projecten">${ICON_L}</button>

  if (p.datum) info.push(`<span>${esc(cap(fmtLang(p.datum)))} · ${esc(aftelTekst(p.datum))}</span>`);
  if (info.length || p.omschrijving) h += `<div class="proj-info">${info.join("")}${p.omschrijving ? `<p>${esc(p.omschrijving)}</p>` : ""}</div>`;

    // nieuwste bovenaan; ideeën die al een taak zijn geworden zakken naar onderen
    const lijst = s.notities.slice().sort((a,b) => ((a.omgezet ? 1 : 0) - (b.omgezet ? 1 : 0)) || String(b.gemaaktOp||"").localeCompare(String(a.gemaaktOp||"")));
    h += lijst.length
      ? `<div class="notities">${lijst.map(notitieKaart).join("")}</div>`
      : `<div class="list"><div class="empty"><b>Nog geen ideeën of lijsten</b>Schrijf hier alles op wat in je opkomt. Een idee zet je later met één tik om in een taak.</div></div>`;

  const open = s.open.slice().sort(sortTasks);
  const klaar = s.taken.filter(t => t.klaar).sort(sortTasks);
  h += secHtml("Open", open.length, listHtml(open, "Geen open taken", "Voeg een taak toe, of zet een idee om in een taak.", {hideProj:true}, {soort:"taak", project:p.id}));
  if (klaar.length){
    if (S.toonKlaar) h += secHtml("Klaar", klaar.length, listHtml(klaar, "", "", {hideProj:true, compact:true}));
    h += toonKlaarKnop(klaar.length);
  }
  return h;
}
function notitieKaart(n){
  if (n.soort === "lijst"){
    const items = n.items || [];

function viewWie(){
  let h = statusNote();
  h += `<div class="sec-h" style="margin-top:14px"><h3>Personen</h3>${S.canWrite ? `<button class="btn sm" type="button" data-act="new-person">+ Persoon</button>` : ""}</div>`;
  if (!S.people.length){
    h += `<div class="list"><div class="empty"><b>Nog niemand toegevoegd</b>Voeg jezelf en je huisgenoten toe om taken te verdelen.</div></div>`;
    return h + instellingenHtml();
  }
  h += `<div class="people">`;
  const today = vandaag();
  for (const p of S.people){
    const mine = S.tasks.filter(t => t.soort !== "boodschap" && (t.wie === p.id || t.wie === "samen"));
    const open = mine.filter(t => !t.klaar);
    const late = open.filter(t => t.datum && t.datum < today).length;
    // echt de eerstvolgende: op datum en tijd, niet eerst de belangrijke
    const next = open.filter(t => t.datum && t.datum >= today).sort((a,b) => (a.datum + (a.tijd||"99")).localeCompare(b.datum + (b.tijd||"99")))[0];
    h += `<div class="person">
      <div class="person-h">
        <span class="avatar" style="background:${esc(p.kleur)}">${esc((p.naam||"?").trim().charAt(0).toUpperCase())}</span>
        <div class="nm"><b>${esc(p.naam)}</b><span>${[p.rol === "helper" ? "Helpt mee met verhuizen" : "", S.ik === p.id ? "Dat ben jij op deze telefoon" : ""].filter(Boolean).join(" · ")}</span></div>
        ${S.canWrite ? `<button class="btn sm" type="button" data-act="edit-person" data-id="${esc(p.id)}">Wijzig</button>` : ""}
      </div>
      <div class="stats"><span><b>${open.length}</b> open</span><span><b>${mine.length - open.length}</b> klaar</span>${late ? `<span style="color:var(--danger)"><b style="color:inherit">${late}</b> te laat</span>` : ""}</div>
      ${next ? `<div class="next">Eerstvolgend: <b>${esc(next.titel)}</b> · ${esc(fmtKort(next.datum))}</div>` : ""}
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm" type="button" data-act="filter-go" data-id="${esc(p.id)}">Bekijk taken</button>
        ${S.ik === p.id ? "" : `<button class="btn sm" type="button" data-act="set-ik" data-id="${esc(p.id)}">Dit ben ik</button>`}
      </div>
    </div>`;
  }
  h += `</div><div class="note">"Samen" telt bij iedereen mee. Wie je op deze telefoon bent, onthoudt alleen deze telefoon.</div>`;
  return h + instellingenHtml();
}
function instellingenHtml(){
  if (!S.user) return "";
  const dag = VERHUISDAG ? cap(VERHUISDAG.toLocaleDateString("nl-NL",{weekday:"long", day:"numeric", month:"long", year:"numeric"})) : "Nog niet ingesteld";
  return `<section class="sec">
    <div class="sec-h"><h3>Instellingen</h3></div>
    <div class="list">
      <button class="set-row" type="button" data-act="edit-instellingen"><span>Nieuw adres</span><b>${esc(ADRES || "Nog niet ingesteld")}</b></button>
      <button class="set-row" type="button" data-act="edit-instellingen"><span>Verhuisdag</span><b>${esc(dag)}</b></button>
      <label class="set-row" for="importFile"><span>Gegevens importeren</span><b>Kies bestand</b></label>
      <button class="set-row" type="button" data-act="ww-vergeten"><span>Wachtwoord wijzigen</span><b>Stuur mail</b></button>
      <button class="set-row" type="button" data-act="uitloggen"><span>Ingelogd als ${esc(S.user.email || "")}</span><b class="out">Uitloggen</b></button>

}

function render(){
  const views = {dag:viewDag, week:viewWeek, taken:viewTaken, projecten:viewProjecten, kopen:viewKopen, wie:viewWie};
  if (!views[S.view]) S.view = "dag";
  const main = $("#view");
  // een live update mag het veld waarin je aan het typen bent niet wegvegen
  const ae = document.activeElement;
  // datumvelden niet: die openen anders opnieuw de kalender, en setSelectionRange werkt er niet op
  const focusId = ae && ae.id && main.contains(ae) && ae.type !== "date" && ae.type !== "time" ? ae.id : null;
  main.innerHTML = views[S.view]();
  if (focusId){ const el = document.getElementById(focusId); if (el){ el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); } }
  document.querySelectorAll("#tabs button").forEach(b => {
    if (b.dataset.tab === S.view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  $("#fab").hidden = !S.canWrite || S.view === "wie";
  const ik = personById(S.ik);
  $("#meBtn").innerHTML = ik ? `<span class="avatar" style="width:22px;height:22px;font-size:11px;background:${esc(ik.kleur)}">${esc(ik.naam.charAt(0).toUpperCase())}</span>${esc(ik.naam)}` : "Wie ben jij?";
  $("#meBtn").hidden = !S.people.length;
  const al = $("#adresLink");
  al.hidden = !ADRES;
  if (ADRES){ al.textContent = ADRES; al.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(ADRES); }
  tick();
}

// "2 melk", "3x paprika", "2 x brood" -> aantal + titel
function leesSnel(tekst){
  const m = tekst.trim().match(/^(\d+)\s*x?\s+(.+)$/i);
  return m ? {aantal: m[1], titel: m[2].trim()} : {aantal: "", titel: tekst.trim()};
}

// actie (optioneel): {label, fn}, bijvoorbeeld "Ongedaan maken"; dan blijft de melding iets langer staan
function toast(msg, actie){
  const host = $("#toastHost");
  S.toastActie = actie || null;
  host.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${actie ? `<button type="button" data-act="toast-actie">${esc(actie.label)}</button>` : ""}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { host.innerHTML = ""; S.toastActie = null; }, actie ? 5000 : 2200);
}
function failMsg(e){
  if (e && (e.code === "permission-denied" || e.code === "invalid_argument")) return "Dit account mag niets opslaan. Vraag Robin om je e-mailadres toe te voegen.";
  if (e && e.code === "quota_exceeded") return "De opslag is vol. Verwijder oude, afgevinkte items.";
  return "Opslaan lukte niet. Controleer je verbinding en probeer het opnieuw.";
}
async function write(fn, okMsg){
  if (!S.db || !S.user){ toast("Log eerst in om iets op te slaan."); return false; }
  try { await fn(S.db); if (okMsg) toast(okMsg); return true; }
  catch(e){ toast(failMsg(e)); return false; }
}
// een eigen id, zodat een nieuwe taak meteen in de agenda kan
const maakId = () => Array.from(crypto.getRandomValues(new Uint8Array(15)), b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
async function saveTask(metAgenda){
  captureForm();
  const s = S.sheet, d = s.data;
  const titel = (d.titel||"").trim();
  if (!titel){ $("#f-titel").focus(); return; }
  let prijs = null;
  if (d.soort === "kopen" && (d.prijsTekst||"").trim()){
    const n = parseFloat(d.prijsTekst.replace(/\./g,"").replace(",", ".").replace(/[^\d.\-]/g,""));
    if (isFinite(n)) prijs = Math.round(n*100)/100;
  }
  const herhaal = herhaalVanKey(d.herhaalKey);
  const proj = d.project ? projectById(d.project) : null;
  const body = {
    titel, soort: d.soort || "taak", wie: d.wie || "", datum: d.datum || (herhaal ? vandaag() : ""), tijd: d.tijd || "",
    // zonder eigen categorie valt een projecttaak in Taken onder de naam van het project
    categorie: (d.categorie||"").trim() || (proj ? proj.naam : ""), project: proj ? proj.id : "",
    notitie: (d.notitie||"").trim(), belangrijk: !!d.belangrijk, prijs,
    klaar: herhaal ? false : !!d.klaar, klaarOp: herhaal ? null : (d.klaarOp || null), gemaaktOp: d.gemaaktOp || new Date().toISOString(),
    herhaal, wisselen: !!herhaal && !!d.wisselen,
    laatstKlaar: herhaal ? (d.laatstKlaar || null) : null, laatstDoor: herhaal ? (d.laatstDoor || null) : null, vorige: herhaal ? (d.vorige || null) : null,
  };
  if (metAgenda && !body.datum){ toast("Kies eerst een datum, dan kan hij in je agenda."); $("#f-datum").focus(); return; }
  const id = s.id || maakId();
  closeSheet();
  // eerst het agendavenster openen; daar tik je zelf op "Naar agenda" (de iPhone wil dat het een tik is)
  if (metAgenda) openSheet({type:"agenda", id, data:{alarm: body.tijd ? "uur" : "avond", taak: Object.assign({id}, body)}});
  const ok = await write(db => db.doc("tasks/"+id).set(body), metAgenda ? "" : s.id ? "Bijgewerkt" : "Toegevoegd");
  if (ok && d.van) await markeerOmgezet(d.van, id);
}

async function markeerOmgezet(van, taakId){
  const n = S.notities.find(x => x.id === van.id); if (!n) return;
  if (van.item){
    const items = (n.items || []).map(i => i.id === van.item ? Object.assign({}, i, {taak: taakId}) : i);
    await write(db => db.doc("notities/" + n.id).update({items}));
  } else {
    await write(db => db.doc("notities/" + n.id).update({omgezet: taakId}));
  }
}

// bij "om en om" gaat de beurt naar de volgende persoon in de lijst
function andere(wie){
  const huis = S.people.filter(p => p.rol !== "helper"); // helpers doen niet mee met om en om
  const i = huis.findIndex(p => p.id === wie);
  if (i < 0 || huis.length < 2) return wie;
  return huis[(i + 1) % huis.length].id;
}
async function toggleTask(id, mode){
  const t = S.tasks.find(x => x.id === id); if (!t || S.busy.has(id)) return;
  S.busy.add(id);
  if (t.herhaal && mode === "undo"){
    const v = t.vorige;
    if (v) await write(db => db.doc("tasks/"+id).update({datum: v.datum, wie: v.wie, laatstKlaar: v.laatstKlaar || null, laatstDoor: v.laatstDoor || null, vorige: null}), "Teruggezet");
    else toast("Dit kan niet meer worden teruggezet.");
  } else if (t.herhaal){
    const volgende = volgendeKeer(t);
    const wie = t.wisselen ? andere(t.wie) : t.wie;
    const ok = await write(db => db.doc("tasks/"+id).update({
      datum: volgende, wie, laatstKlaar: vandaag(), laatstDoor: t.wie || null,
      vorige: {datum: t.datum, wie: t.wie || "", laatstKlaar: t.laatstKlaar || null, laatstDoor: t.laatstDoor || null},
    }));
    if (ok){
      const p = personById(wie);
      toast(`Gedaan. Volgende keer ${fmtKort(volgende)}${t.wisselen && p ? ", " + p.naam + " is aan de beurt" : ""}`,
        {label: "Ongedaan maken", fn: () => toggleTask(id, "undo")});
    }
  } else {
    const klaar = !t.klaar;
    const ok = await write(db => db.doc("tasks/"+id).update({klaar, klaarOp: klaar ? new Date().toISOString() : null}));
    // boodschappen blijven in het mandje staan, de rest verdwijnt uit beeld: geef dan even de kans om terug te draaien
    if (ok && klaar && t.soort !== "boodschap") toast("Afgevinkt", {label: "Ongedaan maken", fn: () => toggleTask(id)});
  }
  S.busy.delete(id);
}

document.addEventListener("click", e => {
  const pick = e.target.closest("[data-pick]");
  if (pick && S.sheet){
    captureForm();
    const k = pick.dataset.pick, v = pick.dataset.v;
    S.sheet.data[k] = v; S.sheet.armed = false;
    renderSheet(); return;
  }
  const tab = e.target.closest("[data-tab]");
  if (tab){
    // nog een keer op Projecten tikken brengt je terug naar het overzicht
    if (tab.dataset.tab === "projecten" && S.view === "projecten") S.project = null;
    S.view = tab.dataset.tab; lsSet("view", S.view); render(); window.scrollTo(0,0); return;
  }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  switch (act){
    case "scrim": if (e.target === a) closeSheet(); break;
    case "close": closeSheet(); break;
    case "new": {
      if (!S.canWrite) return;
      let preset = {};
      try { preset = a.dataset.preset ? JSON.parse(a.dataset.preset) : {}; } catch(_){}
      if (S.view === "kopen" && S.kopenTab === "boodschappen"){
        openSheet({type:"boodschap", data:{winkel: S.winkels[0] ? S.winkels[0].id : ""}});
        break;
      }
      // de plusknop in Projecten: nieuw project, of binnen een project een taak of idee
      if (S.view === "projecten" && !a.dataset.preset){
        if (!S.project){ openSheet({type:"project", data:{kleur: KLEUREN.find(k => !S.projecten.some(p => p.kleur === k)) || KLEUREN[0]}}); break; }
        if (S.projTab === "ideeen"){ openSheet({type:"notitie", data:{soort:"idee", project: S.project}}); break; }
        preset = {soort:"taak", project: S.project};
      }
      const base = {soort: S.view === "kopen" ? S.kopenTab : "taak", wie: S.filter !== "alle" ? S.filter : (S.ik || ""), datum: S.view === "dag" ? S.dag : "", categorie: ""};
      openSheet({type:"task", data: Object.assign(base, preset)});
      break;
    }
    case "edit": {
      const t = S.tasks.find(x => x.id === id); if (!t) return;
      if (!S.canWrite) return;
      if (t.soort === "boodschap"){ openSheet({type:"boodschap", id, data: Object.assign({}, t)}); break; }
      openSheet({type:"task", id, data: Object.assign({}, t, {herhaalKey: herhaalKey(t.herhaal)})});
      break;
    }
    case "toggle": toggleTask(id, a.dataset.mode); break;
    case "delete-task": {
      if (!S.sheet.armed){ captureForm(); S.sheet.armed = true; renderSheet(); return; }
      const tid = S.sheet.id; closeSheet();
      write(db => db.doc("tasks/"+tid).delete(), "Verwijderd");
      break;
    }
    case "new-person": openSheet({type:"person", data:{kleur: KLEUREN.find(k => !S.people.some(p => p.kleur === k)) || KLEUREN[0]}}); break;
    case "edit-person": { const p = personById(id); if (p) openSheet({type:"person", id, data: Object.assign({}, p)}); break; }
    case "delete-person": {
      if (!S.sheet.armed){ captureForm(); S.sheet.armed = true; renderSheet(); return; }
      const pid = S.sheet.id; closeSheet();
      if (S.filter === pid){ S.filter = "alle"; lsSet("filter","alle"); }
      write(db => db.doc("people/"+pid).delete(), "Verwijderd");
      break;
    }
    case "who-am-i": openSheet({type:"ik"}); break;
    case "agenda": saveTask(true); break;
    case "agenda-go": {
      const t = S.sheet.data.taak || S.tasks.find(x => x.id === S.sheet.id); if (!t) return;
      bewaarIcs(t, S.sheet.data.alarm);
      closeSheet();
      break;
    }
    case "toon-klaar": S.toonKlaar = !S.toonKlaar; render(); break;
    case "open-project": S.project = id; S.projTab = "taken"; S.toonKlaar = false; render(); window.scrollTo(0,0); break;
    case "sluit-project": S.project = null; render(); window.scrollTo(0,0); break;
    case "proj-tab": S.projTab = id; render(); break;
    case "new-project": openSheet({type:"project", data:{kleur: KLEUREN.find(k => !S.projecten.some(p => p.kleur === k)) || KLEUREN[0]}}); break;
    case "edit-project": { const p = projectById(id); if (p && S.canWrite) openSheet({type:"project", id, data: Object.assign({}, p)}); break; }
    case "delete-project": {
      if (!S.sheet.armed){ captureForm(); S.sheet.armed = true; renderSheet(); return; }
      const pid = S.sheet.id; closeSheet(); verwijderProject(pid);
      break;
    }
    case "new-notitie": openSheet({type:"notitie", data:{soort: id, project: S.project}}); break;
    case "edit-notitie": { const n = S.notities.find(x => x.id === id); if (n && S.canWrite) openSheet({type:"notitie", id, data: Object.assign({}, n)}); break; }
    case "delete-notitie": {
      if (!S.sheet.armed){ captureForm(); S.sheet.armed = true; renderSheet(); return; }
      const nid = S.sheet.id; closeSheet();
      write(db => db.doc("notities/" + nid).delete(), "Verwijderd");
      break;
    }
    case "idee-taak": {
      const n = S.notities.find(x => x.id === id); if (!n) return;
      openSheet({type:"task", data:{soort:"taak", titel: n.titel, notitie: n.tekst || "", project: n.project, wie: S.ik || "", van: {id: n.id}}});
      break;
    }
    case "li-taak": {
      const n = S.notities.find(x => x.id === id); if (!n) return;
      const item = (n.items || []).find(i => i.id === a.dataset.item); if (!item) return;
      openSheet({type:"task", data:{soort:"taak", titel: item.tekst, notitie: "Uit de lijst: " + n.titel, project: n.project, wie: S.ik || "", van: {id: n.id, item: item.id}}});
      break;
    }
    case "li-toggle": { const it = a.dataset.item; wijzigLijst(id, items => items.map(i => i.id === it ? Object.assign({}, i, {klaar: !i.klaar}) : i)); break; }
    case "li-weg": { const it = a.dataset.item; wijzigLijst(id, items => items.filter(i => i.id !== it), "Punt verwijderd"); break; }
    case "toast-actie": {
      const actie = S.toastActie;
      S.toastActie = null; clearTimeout(toast.t); $("#toastHost").innerHTML = "";
      if (actie) actie.fn();
      break;
    }
    case "ww-vergeten": wachtwoordMail(); break;
    case "uitloggen": signOut(FB.auth); break;
    case "edit-instellingen": openSheet({type:"instellingen", data:{adres: ADRES, verhuisdag: VERHUISDAG ? iso(VERHUISDAG) : ""}}); break;
    case "set-ik": S.ik = id; lsSet("ik", id); if (S.sheet && S.sheet.type === "ik") closeSheet(); render(); toast("Onthouden op deze telefoon"); break;
    case "filter": S.filter = id; lsSet("filter", id); render(); break;
    case "filter-go": S.filter = id; lsSet("filter", id); S.view = "taken"; lsSet("view","taken"); render(); window.scrollTo(0,0); break;
    case "tab": S.view = id; lsSet("view", id); render(); window.scrollTo(0,0); break;
    case "day": S.dag = a.dataset.n === "0" ? vandaag() : iso(addDays(parse(S.dag), +a.dataset.n)); render(); break;
    case "week": S.week = a.dataset.n === "0" ? iso(monday(new Date())) : iso(addDays(parse(S.week), 7 * a.dataset.n)); render(); break;
    case "goto-day": S.dag = id; S.view = "dag"; lsSet("view","dag"); render(); window.scrollTo(0,0); break;
    case "taken-status": S.takenStatus = id; render(); break;
    case "kopen-tab": S.kopenTab = id; lsSet("kopenTab", id); S.wisArmed = ""; render(); break;
    case "new-winkel": openSheet({type:"winkel", data:{}}); break;
    case "edit-winkel": { const w = S.winkels.find(x => x.id === id); if (w) openSheet({type:"winkel", id, data: Object.assign({}, w)}); break; }
    case "delete-winkel": {
      if (!S.sheet.armed){ captureForm(); S.sheet.armed = true; renderSheet(); return; }
      const wid = S.sheet.id; closeSheet();
      write(db => db.doc("winkels/"+wid).delete(), "Winkel verwijderd");
      break;
    }
    case "wis-mandje":
      if (S.wisArmed !== (id || "_")){ S.wisArmed = id || "_"; render(); return; }
      wisMandje(id);
      break;
  }
});

});
document.addEventListener("change", e => {
  if (e.target.id === "dagKiezer" && e.target.value){ S.dag = e.target.value; render(); return; }
  if (e.target.id === "weekKiezer" && e.target.value){ S.week = iso(monday(parse(e.target.value))); render(); return; }
  if (e.target.id === "importFile" && e.target.files[0]){ importeren(e.target.files[0]); e.target.value = ""; }
});
document.addEventListener("input", e => {
  if (e.target.id && (e.target.id.startsWith("qa-") || e.target.id.startsWith("li-"))) S.drafts[e.target.id] = e.target.value;
  // prijsveld tonen of verbergen hangt af van soort; dat loopt via pick. Hier alleen de prijs bijhouden.
  if (e.target.id === "f-prijs" && S.sheet) S.sheet.data.prijsTekst = e.target.value;
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.sheet) closeSheet();
  // kaarten die als knop werken (projecten, ideeën) ook met Enter of spatie openen
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); }
});

/* ---------- inloggen ---------- */
function renderLogin(){
  const host = $("#loginHost");
  if (S.user || !S.authReady){ host.innerHTML = ""; return; }
  host.innerHTML = `<div class="login">
    <div class="login-card">
      <img src="icon-192.png" alt="" width="84" height="84">
      <h2>Het Thuisfront</h2>
      <p>Log in met het e-mailadres en wachtwoord die Robin voor je heeft ingesteld.</p>
      <form id="loginForm" class="form" autocomplete="on">
        <div class="fld"><label for="l-mail">E-mailadres</label><input id="l-mail" type="email" autocomplete="username" required value="${esc(S.loginMail||"")}"></div>
        <div class="fld"><label for="l-ww">Wachtwoord</label><input id="l-ww" type="password" autocomplete="current-password" required></div>
        ${S.loginMsg ? `<div class="note${S.loginErr ? " err" : ""}" style="margin:0">${esc(S.loginMsg)}</div>` : ""}
        <button type="submit" class="btn primary" style="padding:12px">${S.loginBusy ? "Bezig…" : "Inloggen"}</button>
        <button type="button" class="link-btn" data-act="ww-vergeten">Wachtwoord vergeten of zelf kiezen?</button>
      </form>
    </div>
  </div>`;
}
const AUTH_FOUT = {
  "auth/invalid-credential": "Dit e-mailadres en wachtwoord horen niet bij elkaar. Controleer ze en probeer het opnieuw.",
  "auth/wrong-password": "Dit wachtwoord klopt niet.",
  "auth/user-not-found": "Er is geen account met dit e-mailadres. Vraag Robin om je toe te voegen.",
  "auth/invalid-email": "Dit is geen geldig e-mailadres.",
  "auth/too-many-requests": "Te veel pogingen. Wacht een paar minuten en probeer het dan opnieuw.",
  "auth/network-request-failed": "Geen internetverbinding. Probeer het opnieuw zodra je verbinding hebt.",
};
async function inloggen(){
  const mail = $("#l-mail").value.trim(), ww = $("#l-ww").value;
  S.loginMail = mail; S.loginBusy = true; S.loginMsg = ""; renderLogin();
  try { await signInWithEmailAndPassword(FB.auth, mail, ww); S.loginMsg = ""; }
  catch(e){ S.loginErr = true; S.loginMsg = AUTH_FOUT[e.code] || "Inloggen lukte niet. Probeer het opnieuw."; }
  S.loginBusy = false; renderLogin();
}
async function wachtwoordMail(){
  const mail = ($("#l-mail") ? $("#l-mail").value : (S.user && S.user.email) || "").trim();
  if (!mail){ S.loginErr = true; S.loginMsg = "Vul eerst je e-mailadres in."; renderLogin(); return; }
  try {
    await sendPasswordResetEmail(FB.auth, mail);
    S.loginErr = false; S.loginMsg = `Er is een mail naar ${mail} gestuurd. Kies daarin een nieuw wachtwoord en log daarna hier in. Kijk ook bij ongewenste mail.`;
  } catch(e){ S.loginErr = true; S.loginMsg = AUTH_FOUT[e.code] || "Versturen lukte niet. Probeer het opnieuw."; }
  if (S.user) toast(S.loginMsg); else renderLogin();
}

/* ---------- importeren ---------- */
async function importeren(file){
  let data;
  try { data = JSON.parse(await file.text()); } catch(_){ toast("Dit bestand kan ik niet lezen. Kies thuisfront-export.json."); return; }
  const items = [];
  for (const col of ["people","winkels","tasks","projecten","notities","instellingen"]){
    const docs = data[col] || {};
    for (const id of Object.keys(docs)) items.push([col + "/" + id, docs[id]]);
  }
  if (!items.length){ toast("Er staat niets in dit bestand om te importeren."); return; }
  toast("Bezig met importeren…");
  try { await S.db.batchSet(items); toast(`${items.length} items geïmporteerd`); }
  catch(e){ toast(failMsg(e)); }
}

/* ---------- verbinden ---------- */
const FB = {};
let afmelden = [];
function maakDB(fs){
  // fromCache: true zolang het nog niet de echte stand van de server is (de app onthoudt de lijst ook offline)
  const snapDocs = s => ({fromCache: s.metadata.fromCache, docs: s.docs.map(d => ({id: d.id, data: () => d.data()}))});
  // ops: [pad, gegevens, "set" | "update" | "delete"]; standaard "set"
  const batch = async ops => {
    for (let i = 0; i < ops.length; i += 400){
      const b = writeBatch(fs);
      ops.slice(i, i + 400).forEach(([p, d, soort]) => {
        if (soort === "delete") b.delete(doc(fs, p));
        else if (soort === "update") b.update(doc(fs, p), d);
        else b.set(doc(fs, p), d);
      });
      await b.commit();
    }
  };
  return {
    collection: p => ({
      add: data => addDoc(collection(fs, p), data),
      onSnapshot: (next, err) => onSnapshot(collection(fs, p), {includeMetadataChanges: true}, s => next(snapDocs(s)), err),
    }),
    doc: p => ({
      set: data => setDoc(doc(fs, p), data),
      update: data => updateDoc(doc(fs, p), data),
      delete: () => deleteDoc(doc(fs, p)),
      onSnapshot: (next, err) => onSnapshot(doc(fs, p), {includeMetadataChanges: true}, d => next({fromCache: d.metadata.fromCache, exists: d.exists(), data: () => d.data()}), err),
    }),
    batch,
    batchSet: items => batch(items),
  };
}
function luisteren(){
  const db = S.db;
  let gotP = false, gotT = false;
  const done = () => { if (gotP && gotT) S.ready = true; };
  const onErr = e => {
    S.loadErr = e && e.code === "permission-denied"
      ? "Dit account heeft geen toegang tot de planning. Vraag Robin om je e-mailadres toe te voegen."
      : "De verbinding met de planning is weggevallen. Sluit de app en open hem opnieuw.";
    render();
  };
  const sorteer = arr => arr.sort((a,b) => (a.volgorde||0)-(b.volgorde||0) || String(a.naam).localeCompare(String(b.naam),"nl"));
  afmelden = [
    db.collection("people").onSnapshot(snap => {
      S.people = sorteer(snap.docs.map(d => Object.assign({id:d.id}, d.data())));
      gotP = true; done(); render(); if (S.sheet) { captureForm(); renderSheet(); }
    }, onErr),
    db.collection("winkels").onSnapshot(snap => {
      S.winkels = sorteer(snap.docs.map(d => Object.assign({id:d.id}, d.data())));
      render(); if (S.sheet) { captureForm(); renderSheet(); }
    }, onErr),
    db.collection("tasks").onSnapshot(snap => {
      S.tasks = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
      vers.tasks = !snap.fromCache;
      gotT = true; done(); render(); migreerProjecten();
    }, onErr),
    db.collection("projecten").onSnapshot(snap => {
      S.projecten = sorteer(snap.docs.map(d => Object.assign({id:d.id}, d.data())));
      vers.projecten = !snap.fromCache;
      render(); if (S.sheet) { captureForm(); renderSheet(); } migreerProjecten();
    }, onErr),
    db.collection("notities").onSnapshot(snap => {
      S.notities = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
      render();
    }, onErr),
    db.doc("instellingen/algemeen").onSnapshot(d => {
      zetInstellingen(d.exists ? d.data() : {});
      vers.inst = !d.fromCache;
      render(); migreerProjecten();
    }, onErr),
  ];
}
function stoppen(){
  afmelden.forEach(f => { try { f(); } catch(_){} });
  afmelden = [];
  Object.assign(S, {people: [], tasks: [], winkels: [], projecten: [], notities: [], ready: false, loadErr: ""});
  Object.assign(vers, {tasks: false, projecten: false, inst: false});
  zetInstellingen({});
}

// Eenmalig: projecten Verhuizing en Bruiloft aanmaken en de taken uit die categorieën eraan koppelen.
// Pas als de echte stand van de server binnen is, zodat we niets ouds terugschrijven. Beide telefoons
// mogen dit tegelijk doen: het resultaat is hetzelfde.
const vers = {tasks: false, projecten: false, inst: false};
let migratieBezig = false;
async function migreerProjecten(){
  if (migratieBezig || !S.user || !vers.tasks || !vers.projecten || !vers.inst || S.instellingen.projectenV1) return;
  migratieBezig = true;
  const nu = new Date().toISOString();
  const ops = [];
  const basis = [["verhuizing", "Verhuizing", "#EE4E5A", S.instellingen.verhuisdag || ""], ["bruiloft", "Bruiloft", "#7A5BC2", ""]];
  basis.forEach(([id, naam, kleur, datum], i) => {
    if (!S.projecten.some(p => p.id === id))
      ops.push(["projecten/" + id, {naam, kleur, omschrijving: "", datum, status: "lopend", volgorde: i + 1, gemaaktOp: nu}]);
  });
  for (const t of S.tasks){
    const id = {Verhuizing: "verhuizing", Bruiloft: "bruiloft"}[t.categorie];
    if (id && !t.project) ops.push(["tasks/" + t.id, {project: id}, "update"]);
  }
  ops.push(["instellingen/algemeen", Object.assign({}, S.instellingen, {projectenV1: true})]);
  try { await S.db.batch(ops); } catch(_){ /* volgende keer opnieuw */ }
  migratieBezig = false;
}

render();
if (!FIREBASE_CONFIG.apiKey){
  S.loadErr = "De app is nog niet gekoppeld aan de opslag.";
  S.canWrite = false; render();
} else {
  const app = initializeApp(FIREBASE_CONFIG);
  const fs = initializeFirestore(app, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})});
  FB.auth = getAuth(app);
  S.db = maakDB(fs);
  onAuthStateChanged(FB.auth, u => {
    S.user = u; S.authReady = true;
    stoppen();
    if (u){ S.canWrite = true; luisteren(); }
    render(); renderLogin();
  });
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
